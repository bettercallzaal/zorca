# Placement note: this file changes behaviour, unlike the templates beside it.
# blank_issues_enabled: false forces every reporter through a template.
# Left TRUE in the draft - forcing templates on a small public repo tends to
# turn away the one-line report that was worth having. Zaal's call.
blank_issues_enabled: true
contact_links:
  - name: Security or disclosure concern
    url: https://github.com/bettercallzaal/zorca/security/advisories/new
    about: Do not open a public issue for anything involving credentials, hostnames, or private data. Report it privately here.
